<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Patheyo Admin</title><link rel="stylesheet" href="../assets/style.css">
<style>main{max-width:960px;margin:2rem auto;padding:0 1.2rem}input,textarea,select{width:100%;font:inherit;padding:.6rem .8rem;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}label{display:block;margin:.8rem 0 .2rem;font-weight:600}.g{display:grid;gap:0 1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}table{width:100%;border-collapse:collapse}td,th{padding:.5rem;border-bottom:1px solid var(--line);text-align:left}.tw{overflow-x:auto}.err{color:var(--red)}[hidden]{display:none!important}</style></head>
<body><main>
<h1 style="font-size:2rem">Patheyo Admin</h1><p id="msg" role="status"></p>
<form id="login" class="rel"><label for="e">Email</label><input id="e" type="email" autocomplete="username" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required><p><button class="btn p">Log in</button></p></form>
<div id="app" hidden>
<p><button class="btn" id="out">Logout</button></p>
<div class="stats" id="st"></div>
<h2 style="margin-top:2rem">Releases</h2><div class="tw"><table id="tb"></table></div>
<h2 style="margin-top:2rem" id="ft">New release</h2>
<form id="f" class="rel"><input type="hidden" id="id">
<div class="g"><div><label for="v">Version (e.g. 1.4.0)</label><input id="v" required maxlength="32"></div><div><label for="d">Release date</label><input id="d" type="date" required></div><div><label for="s">File size</label><input id="s" placeholder="42 MB"></div><div><label for="u">Download URL (https)</label><input id="u" type="url" required></div>
<div><label for="t">Status</label><select id="t"><option>draft</option><option>published</option><option>archived</option></select></div><div><label for="l">Latest?</label><select id="l"><option value="false">No</option><option value="true">Yes — make this the latest</option></select></div></div>
<div class="g"><div><label for="nf">New features (one per line)</label><textarea id="nf" rows="5"></textarea></div><div><label for="im">Improvements</label><textarea id="im" rows="5"></textarea></div><div><label for="bf">Bug fixes</label><textarea id="bf" rows="5"></textarea></div><div><label for="ot">Other changes</label><textarea id="ot" rows="5"></textarea></div></div>
<p><button class="btn p">Save release</button> <button type="reset" class="btn" id="rs">Clear</button></p></form></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="../config.js"></script>
<script>
const $=s=>document.querySelector(s),C=window.PATHEYO,msg=(t,e)=>{$('#msg').textContent=t;$('#msg').className=e?'err':''};
if(!C.SUPABASE_URL){msg('config.js এ Supabase URL/anon key দিন।',1)}
const sb=supabase.createClient(C.SUPABASE_URL||'https://x.supabase.co',C.SUPABASE_ANON_KEY||'x');
const lines=id=>$(id).value.split('\n').map(x=>x.trim()).filter(Boolean),fill=(id,a)=>$(id).value=(a||[]).join('\n');
async function guard(){const{data:{session}}=await sb.auth.getSession();
 if(!session){$('#login').hidden=false;$('#app').hidden=true;return}
 const{data}=await sb.from('admins').select('user_id').eq('user_id',session.user.id);
 if(!data||!data.length){await sb.auth.signOut();msg('এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই।',1);return}
 $('#login').hidden=true;$('#app').hidden=false;msg('');load()}
$('#login').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$('#e').value,password:$('#p').value});$('#p').value='';error?msg('লগইন ব্যর্থ। তথ্য যাচাই করুন।',1):guard()};
$('#out').onclick=async()=>{await sb.auth.signOut();guard()};
async function load(){
 const[s,r,v]=await Promise.all([sb.rpc('get_public_stats'),sb.from('releases').select('*').order('release_date',{ascending:false}),sb.rpc('admin_version_distribution')]);
 const x=(Array.isArray(s.data)?s.data[0]:s.data)||{},cur=(r.data||[]).find(a=>a.is_latest);
 $('#st').innerHTML=[['Downloads',x.downloads],['Updates',x.updates],['Active users (15 min)',x.active_users]].map(([k,n])=>`<div><b>${n??'—'}</b><span>${k}</span></div>`).join('')+`<div style="grid-column:1/-1"><span>Latest: ${cur?cur.version:'—'} · Versions: ${(v.data||[]).map(a=>a.version+' ×'+a.installs).join(', ')||'—'}</span></div>`;
 $('#tb').innerHTML='<tr><th>Version</th><th>Date</th><th>Status</th><th></th></tr>'+(r.data||[]).map(a=>`<tr><td>${a.version}${a.is_latest?' ★':''}</td><td>${a.release_date}</td><td>${a.status}</td><td><button class="btn" data-e="${a.id}">Edit</button> <button class="btn" data-x="${a.id}">Delete</button></td></tr>`).join('');
 window.R=r.data||[]}
$('#tb').onclick=async e=>{const b=e.target;const a=R.find(z=>z.id===(b.dataset.e||b.dataset.x));if(!a)return;
 if(b.dataset.x){if(confirm('Delete v'+a.version+'?')){const{error}=await sb.from('releases').delete().eq('id',a.id);error?msg('মুছতে ব্যর্থ',1):load()}return}
 $('#id').value=a.id;$('#v').value=a.version;$('#d').value=a.release_date;$('#s').value=a.file_size||'';$('#u').value=a.download_url;$('#t').value=a.status;$('#l').value=String(a.is_latest);fill('#nf',a.new_features);fill('#im',a.improvements);fill('#bf',a.bug_fixes);fill('#ot',a.other_changes);$('#ft').textContent='Edit v'+a.version;scrollTo(0,document.body.scrollHeight)};
$('#rs').onclick=()=>{$('#id').value='';$('#ft').textContent='New release'};
$('#f').onsubmit=async e=>{e.preventDefault();
 if(!/^https:\/\//.test($('#u').value))return msg('Download URL অবশ্যই https হতে হবে।',1);
 const row={version:$('#v').value.trim(),release_date:$('#d').value,file_size:$('#s').value.trim()||null,download_url:$('#u').value.trim(),status:$('#t').value,is_latest:$('#l').value==='true',new_features:lines('#nf'),improvements:lines('#im'),bug_fixes:lines('#bf'),other_changes:lines('#ot')};
 const q=$('#id').value?sb.from('releases').update(row).eq('id',$('#id').value):sb.from('releases').insert(row);
 const{error}=await q;if(error)return msg('সেভ ব্যর্থ: ভার্সন ডুপ্লিকেট বা অনুমতি নেই।',1);
 msg('Saved.');$('#f').reset();$('#id').value='';load()};
guard();
</script></body></html>
