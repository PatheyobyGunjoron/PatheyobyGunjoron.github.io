<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>অ্যাডমিন প্যানেল — Patheyo</title><link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--navy:#002657;--blue:#005D92;--red:#EC1C24;--bg:#06152e;--glass:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--mu:#9fb2d4}
*{box-sizing:border-box;margin:0}body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:#e8eefb;min-height:100vh;padding:20px}
.box{max-width:960px;margin:auto}.card{background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:24px;margin-bottom:18px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}.top b{font-size:1.2rem}.top img{width:56px;border-radius:9px;vertical-align:middle;margin-right:8px}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.3);color:#fff;font:inherit;margin:6px 0 14px}textarea{min-height:200px;direction:ltr}
label{color:var(--mu);font-size:.9rem}.btn{padding:11px 22px;border-radius:12px;border:0;cursor:pointer;font:inherit;font-weight:600;color:#fff;background:var(--blue)}.btn.r{background:var(--red)}.btn.o{background:var(--glass);border:1px solid var(--bd)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.s{background:var(--glass);border:1px solid var(--bd);border-radius:18px;padding:20px}.s{text-align:center}.s i{font-size:1.5rem;color:#5fc0f5}.s b{display:block;font-size:2.2rem}.s span{color:var(--mu)}
#login{max-width:400px;margin:12vh auto;text-align:center}#login .ic{width:min(200px,60vw);margin:0 auto 14px;display:block;border-radius:18px}#msg{color:#ff8a8f;min-height:24px;font-size:.9rem}#dash{display:none}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px}.row input{width:auto;margin:0}small{color:var(--mu)}
</style></head><body>
<div id="login" class="card"><img class="ic" src="logo.svg" alt=""><h2>অ্যাডমিন লগইন</h2><p style="color:var(--mu);margin-bottom:14px">শুধুমাত্র অনুমোদিত অ্যাডমিনের জন্য</p>
<input id="em" type="email" placeholder="ইমেইল" autocomplete="username"><input id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
<div id="msg"></div><button class="btn" id="go" style="width:100%"><i class="fa-solid fa-right-to-bracket"></i> প্রবেশ করুন</button><p style="margin-top:14px"><a href="index.html" style="color:var(--mu)">← ওয়েবসাইটে ফিরুন</a></p></div>

<div id="dash" class="box">
<div class="top"><span><img src="logo.svg" alt=""><b>অ্যাডমিন প্যানেল</b></span><span><a class="btn o" href="index.html" style="text-decoration:none;display:inline-block">ওয়েবসাইট দেখুন</a> <button class="btn r" id="out"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button></span></div>
<div class="card"><h3 style="margin-bottom:14px"><i class="fa-solid fa-users"></i> অ্যাপ ইউজার</h3><div class="st">
<div class="s"><i class="fa-solid fa-mobile-screen"></i><b id="n1">–</b><span>মোট ইউজার</span></div>
<div class="s"><i class="fa-solid fa-bolt"></i><b id="n2">–</b><span>গত ২৪ ঘণ্টায় সক্রিয়</span></div>
<div class="s"><i class="fa-solid fa-calendar-week"></i><b id="n3">–</b><span>গত ৭ দিনে সক্রিয়</span></div></div>
<button class="btn o" id="rf" style="margin-top:14px"><i class="fa-solid fa-rotate"></i> রিফ্রেশ</button></div>
<div class="card"><h3 style="margin-bottom:14px"><i class="fa-solid fa-sliders"></i> ওয়েবসাইট নিয়ন্ত্রণ</h3>
<label>হিরো শিরোনাম</label><input id="f_title"><label>হিরো উপশিরোনাম</label><input id="f_sub">
<label>ডাউনলোড লিংক — সরাসরি .apk লিংক (ফাঁকা রাখলে সর্বশেষ রিলিজের APK নিজে থেকে ডাউনলোড হবে)</label><input id="f_url" dir="ltr"><label>অ্যাপ সংস্করণ</label><input id="f_ver" dir="ltr">
<label>ঘোষণা বার (ফাঁকা রাখলে দেখাবে না)</label><input id="f_ann">
<div class="row"><input type="checkbox" id="f_mt"><label for="f_mt">রক্ষণাবেক্ষণ মোড (সাইট সাময়িক বন্ধ)</label></div>
<label>ফিচার তালিকা — প্রতি লাইনে: <code dir="ltr">আইকন|শিরোনাম|পয়েন্ট১;পয়েন্ট২</code></label><textarea id="f_feat"></textarea>
<button class="btn" id="sv"><i class="fa-solid fa-floppy-disk"></i> সংরক্ষণ করুন</button> <small id="ok"></small></div></div>

<script src="config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,where,getCountFromServer} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=i=>document.getElementById(i),app=initializeApp(FB),auth=getAuth(app),db=getFirestore(app);
const K=['title','sub','url','ver','ann','feat'];let fails=+sessionStorage.f||0,lock=+sessionStorage.l||0,idle;
const cnt=async w=>(await getCountFromServer(w?query(collection(db,"users"),where("lastSeen",">=",Date.now()-w)):collection(db,"users"))).data().count;
async function stats(){try{const r=await Promise.all([cnt(0),cnt(864e5),cnt(6048e5)]);r.forEach((v,i)=>$("n"+(i+1)).textContent=v.toLocaleString("bn-BD"))}catch{$("n1").textContent="ত্রুটি"}}
async function load(){try{const s=await getDoc(doc(db,"site","config"));if(s.exists()){const d=s.data();K.forEach(k=>$("f_"+k).value=d[k]||"");$("f_mt").checked=!!d.mt}}catch{}}
function reset(){clearTimeout(idle);idle=setTimeout(()=>signOut(auth),9e5)}
["click","keydown","mousemove"].forEach(ev=>addEventListener(ev,()=>auth.currentUser&&reset()));
onAuthStateChanged(auth,u=>{$("login").style.display=u?"none":"block";$("dash").style.display=u?"block":"none";if(u){reset();stats();load()}});
$("go").onclick=async()=>{if(Date.now()<lock){$("msg").textContent="অনেকবার ভুল হয়েছে। কিছুক্ষণ পর চেষ্টা করুন।";return}
try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);sessionStorage.f=fails=0;$("pw").value=""}
catch{fails++;sessionStorage.f=fails;if(fails>=5){sessionStorage.l=lock=Date.now()+3e5;sessionStorage.f=fails=0}$("msg").textContent="ইমেইল বা পাসওয়ার্ড সঠিক নয়"}};
$("pw").onkeydown=e=>e.key==="Enter"&&$("go").click();
$("out").onclick=()=>signOut(auth);$("rf").onclick=stats;
$("sv").onclick=async()=>{const d={mt:$("f_mt").checked};K.forEach(k=>d[k]=$("f_"+k).value.trim());
if(d.url&&!/^https:\/\//.test(d.url)){$("ok").textContent="লিংক https:// দিয়ে শুরু হতে হবে";return}
try{await setDoc(doc(db,"site","config"),d);$("ok").textContent="✔ সংরক্ষিত হয়েছে"}catch{$("ok").textContent="সংরক্ষণ ব্যর্থ — অনুমতি নেই"}};
</script></body></html>
