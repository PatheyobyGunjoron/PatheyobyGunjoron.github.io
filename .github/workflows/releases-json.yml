name: Update releases.json

# নতুন রিলিজ দিলে (বা সম্পাদনা/মুছলে) এবং প্রতি ৬ ঘণ্টায় ওয়েবসাইটের জন্য রিলিজ তালিকা (patheyo/data/releases.json) নতুন করে তৈরি করে।
# এতে ডাউনলোড বাটন GitHub API-র রেট-লিমিটের ওপর নির্ভর করে না, সবার ফোনে ১০০% কাজ করে।
on:
  release:
    types: [published, edited, deleted, released, prereleased]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p patheyo/data
          gh api "repos/${{ github.repository }}/releases?per_page=100" > /tmp/releases.json
          jq '[.[] | select(.draft | not) | {tag_name, name, draft, prerelease, published_at, html_url, body, assets: [.assets[] | {name, size, download_count, browser_download_url}]}]' /tmp/releases.json > patheyo/data/releases.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patheyo/data/releases.json
          git diff --cached --quiet || (git commit -m "chore: update releases.json" && git push)
