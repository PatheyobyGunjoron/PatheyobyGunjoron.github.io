name: Send Push Notification on Release

on:
  release:
    types: [published]

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests google-auth

      - name: Send FCM v1 notification to topic 'all'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 -c "
          import os, json, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          info = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_KEY'])
          project_id = info['project_id']

          creds = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/firebase.messaging']
          )
          creds.refresh(Request())

          title = (os.environ.get('RELEASE_NAME') or '').strip() or 'নতুন আপডেট এসেছে!'
          full_body = os.environ.get('RELEASE_BODY') or ''
          short_body = full_body if len(full_body) <= 100 else full_body[:100] + '...'

          payload = {
              'message': {
                  'topic': 'all',
                  'notification': {
                      'title': title,
                      'body': short_body
                  },
                  'data': {
                      'click_action': 'FLUTTER_NOTIFICATION_CLICK',
                      'update_notes': full_body
                  }
              }
          }

          url = 'https://fcm.googleapis.com/v1/projects/' + project_id + '/messages:send'
          headers = {
              'Authorization': 'Bearer ' + creds.token,
              'Content-Type': 'application/json; charset=UTF-8'
          }

          response = requests.post(url, headers=headers, json=payload, timeout=30)
          print('Status Code:', response.status_code)
          print('Response:', response.text)

          if response.status_code != 200:
              raise Exception('FCM request failed: ' + str(response.status_code) + ' - ' + response.text)

          print('Notification sent successfully!')
          "
